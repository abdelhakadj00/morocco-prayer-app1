name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # إعداد لغة Java 17 المطلوبة لأحدث تطبيقات الأندرويد
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # الخطوة السحرية: إنشاء مجلد الأندرويد المفقود تلقائياً
      - name: Generate Android Project
        run: |
          mkdir -p test
          touch test/widget_test.dart
          flutter create --project-name morocco_prayer_times --org com.morocco .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: morocco-prayer-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
