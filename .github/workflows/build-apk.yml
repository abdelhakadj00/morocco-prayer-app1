name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Generate Android Project
        run: |
          mkdir -p test
          touch test/widget_test.dart
          flutter create --project-name morocco_prayer_times --org com.morocco .

      # الخطوة المبسطة والمضمونة: تعديل سطر واحد فقط لإصدار Kotlin وسطر لإصدار Android
      - name: Fix Android Build Configurations
        run: |
          # 1. تغيير إصدار Kotlin من 1.7.10 إلى 1.9.0
          sed -i "s/ext.kotlin_version = '1.7.10'/ext.kotlin_version = '1.9.0'/" android/build.gradle
          
          # 2. تغيير minSdkVersion إلى 21 لدعم إضافات الموقع والبوصلة
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          sed -i 's/minSdkVersion 19/minSdkVersion 21/' android/app/build.gradle
          sed -i 's/minSdkVersion 20/minSdkVersion 21/' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: morocco-prayer-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
